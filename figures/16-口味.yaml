type: cards
cols: 2
title: 口味说出来，店员替你挑
cards:
  - title: 怕苦，喜欢甜一点
    key: 拿铁 · 燕麦拿铁 · 风味特调
    text: “咖啡怕苦，有没有奶味重、不太酸的？”
  - title: 想试招牌，又怕太怪
    key: 店里卖得最好的那杯
    text: “第一次来，卖得最好的是哪一杯？”
  - title: 想喝黑咖啡，不懂豆子
    key: 手冲 · 美式
    text: “喜欢顺一点、带果香的，不要太酸。”
    sub: 记住喝到的是偏花香，还是偏坚果巧克力
  - title: 进茶馆，不懂茶
    key: 清淡选绿茶白茶，浓选红茶普洱
    text: “想喝清淡一点的，能多泡几次的。”
    sub: 点之前问：多少钱一壶，能泡几次
