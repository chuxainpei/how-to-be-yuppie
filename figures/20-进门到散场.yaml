type: steps
title: 一场音乐会，从进门到散场
steps:
  - title: 开演前一小时到
    text: 安检、取票、存衣服都要时间，开演前 45 分钟开始进剧场
  - title: 先去衣帽间
    text: 吃的喝的、外套、书包都存掉，号牌拍照
  - title: 找座位
    say: 您好，我是一层 12 排 8 号，从哪个门进比较近？
  - title: 开演前
    text: 去洗手间；手机静音、调暗、收进包；翻节目单数乐章
  - title: 演出中
    text: 乐章之间不鼓掌，拿不准就等；一张都不拍
  - title: 谢幕和散场
    text: 谢幕时可以拍；大幕关上再起身，去取外套
