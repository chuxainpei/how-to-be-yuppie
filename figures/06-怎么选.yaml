type: decision
decisions:
  - question: 选哪一种？
    branches:
      - if: 偶尔戴、怕麻烦、宿舍洗手不方便
        text: 戴一天扔一天，不用护理液
        then: 日抛，首选
      - if: 几乎天天戴，每晚愿意花五分钟护理
        text: 镜片便宜一点，护理液和镜盒另算
        then: 可以考虑月抛
      - if: 想白天不戴镜，才想到 OK 镜
        text: 贵、每晚要戴、要常跑医院，一停就回退
        then: 多数大学生不值
  - question: 戴着不舒服，是哪一种？
    branches:
      - if: 刚戴上有异物感，眨几下就好
        then: 适应期，时间慢慢加
      - if: 一只眼一直难受
        text: 看看是不是戴反、破了、进了东西
        then: 摘下冲洗再试，不行换框架
      - if: 眼红、刺痛、怕光、流泪、看不清
        then: 立刻摘镜，不缓解当天去眼科
