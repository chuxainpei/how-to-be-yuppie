type: cards
title: 把“修一下”拆成理发师能动手的四行
cols: 2
cards:
  - title: 长度
    key: 用身体部位当尺子
    text: "“两侧露出耳朵，顶部捏起来大概一个指节长，后面不碰衣领。”"
  - title: 轮廓
    key: 哪里服帖、哪里蓬，两侧推不推
    text: "“两侧服帖，但别推到发青，头顶留点蓬松。”"
  - title: 每天打理多久
    key: 最容易被跳过的一行
    text: "“早上最多五分钟，不太会用吹风机。”"
  - title: 场合
    key: 面试、证件照，还是换个心情
    text: "“下个月要面试，想干净、不夸张。”"
