type: cards
cols: 3
title: 先看墙上的作品在不在卖
cards:
  - title: 商业画廊
    key: 作品在卖，看展免费
    items: [推门就进，没有闸机, 拿一份展览介绍边走边看, 价格不贴墙，问前台, 背小包，多半没寄存]
  - title: 售票美术馆
    key: 作品不卖，进门买票
    items: [一张一百出头, 两人买双人票更省, 电子票扫码，截图不算数, 导览活动票不含门票, 一般有寄存处]
  - title: 免费美术馆
    key: 不要钱，要预约
    items: [实名预约，热门展早抢, 带预约用的证件原件, 包存在前台，当天取走, 去不了记得取消]
