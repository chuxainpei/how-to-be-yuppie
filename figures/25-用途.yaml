type: cards
title: 先想拿它做什么，再进对应的店
cols: 3
cards:
  - title: 打球、日常运动
    text: "先看：耐克、阿迪、彪马、安踏、李宁"
    items: ["按项目买鞋，篮球鞋别拿去跑步"]
  - title: 跑步
    text: "先看：亚瑟士、新百伦、HOKA、昂跑，国产的安踏、李宁"
    items: ["一双合脚的日常跑鞋", "新手别碰碳板竞速鞋"]
  - title: 健身、瑜伽
    text: "先看：lululemon 和国产瑜伽服"
    items: ["一条蹲下不透的紧身裤"]
  - title: 爬山、下雨
    text: "先看：北面、Columbia、Salomon、始祖鸟、迪桑特"
    items: ["真防水的硬壳，或抓地好的徒步鞋", "城里通勤用不上顶级装备"]
  - title: 就想穿着好看
    text: "先看：FILA、鬼塚虎、中国李宁、新百伦复古款"
    items: ["喜欢就买，别为用不上的功能多付钱"]
