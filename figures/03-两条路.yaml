type: decision
title: 这颗牙走补牙还是根管
question: 牙神经有没有发炎？医生检查、拍片后告诉你
branches:
  - if: 浅的、中等的，没自己疼过
    text: 去掉坏的部分，直接补上
    then: 补牙：多半一次，北京公立两三百
  - if: 蛀得很深，快碰到牙神经
    text: 可能先观察或临时封上，补完更容易敏感
    then: 先补，有可能后来转根管
  - if: 自己疼、夜里疼、咬着疼、牙龈鼓包
    text: 牙神经已经发炎，补上等于把感染封在里面
    then: 根管：跑好几趟，一千出头起，多半还要牙冠
