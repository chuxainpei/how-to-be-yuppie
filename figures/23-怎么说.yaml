type: decision
title: 店员跟着你时，照着说
decisions:
  - question: 店员一直跟在旁边
    branches:
      - if: 想自己看
        text: “谢谢，我先自己看一圈，有需要再叫您。”
        then: 对方一般会退开一点
      - if: 要帮忙，不想被推销
        text: “麻烦拿一双 42 码，我试完自己看看。”
        then: 只接具体的请求
      - if: 开始讲会员、新品、限量
        text: “今天先了解一下。”
        then: 话题不用接
  - question: 要走了
    branches:
      - if: 试完不买
        text: “谢谢您帮我拿，今天先不买了。”
        then: 东西交还，直接走
      - if: 被问留联系方式
        text: “不用了，需要的时候我再来。”
        then: 不想留就不留
      - if: 店员提出刻字、烫印、改裤长
        text: “这个收费吗？做完还能退换吗？”
        then: 问清再答应
