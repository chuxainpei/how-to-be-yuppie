type: decision
title: 脸上是哪种痘，自己管还是马上去
decisions:
  - question: 照镜子看，你脸上以什么为主？
    branches:
      - {if: "只有闭口、黑头", text: "白色或肤色小凸起、毛孔口黑点，不红不疼", then: "洗对脸、管住手，给它三个月"}
      - {if: "红色硬包、黄白脓头", text: "长出来那几天胀痛，碰到会疼", then: "别挤，早点挂个普通号"}
      - {if: "又大又硬的结节、囊肿", text: "长在深处，疼得厉害", then: "马上去，越早留疤越少"}
  - question: 再看有没有这些情况，有一条就别等
    branches:
      - {if: "已经留疤，或一长痘就留坑", then: "尽早去"}
      - {if: "女生，痘集中在下巴一圈", text: "还伴着月经不规律、出油重、经前加重", then: "挂号时提一句"}
      - {if: "不想出门、不敢拍照", then: "这就是该去的理由"}
      - {if: "拿不准是不是痘", text: "玫瑰痤疮、毛囊炎长得很像", then: "让医生当面看"}
