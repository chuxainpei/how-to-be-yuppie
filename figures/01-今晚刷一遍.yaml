type: checklist
title: 今晚对着镜子照这张单子刷一遍
items:
  - {text: 豌豆大小的含氟牙膏, sub: 别的功效都是锦上添花}
  - {text: 刷毛斜 45 度，对准牙和牙龈交界处, sub: 轻轻压住，原地小幅抖几下，再往牙尖方向转}
  - {text: 一次只管两三颗，挪一点再来, sub: 外侧、内侧、咬合面都要刷到；门牙内侧把牙刷竖起来}
  - {text: 分四块，每块半分钟, sub: 最容易漏的是最里面的大牙和下门牙内侧}
  - {text: 轻刷舌头，清水漱口, sub: 牙刷冲净甩干，刷头朝上放}
  - {text: 晚上过一遍牙线, sub: 卡住就前后轻拉，别硬按；弯成 C 字贴着两侧牙面刮}
