type: checklist
title: 染发烫发，坐下之前问清这几件事
items:
  - {text: "我这个颜色要不要漂？漂几次？", sub: "染浅色绕不开漂，这一步最伤头发"}
  - {text: "用哪个产品？能看一下包装吗？", sub: "找背面“国妆特”开头的编号"}
  - {text: "能先做皮肤测试，过两天再来吗？", sub: "耳后试，至少等两天"}
  - {text: "我这个长度按哪一档？含不含剪发、洗吹？", sub: "让对方报一个最后的总数"}
  - {text: "以后补根怎么收？", sub: "染浅色一个多月就要补一次"}
  - {text: "烫完不吹是什么样子？", sub: "第三天早上的样子才算数"}
  - {text: "这个护理是必须的吗？", sub: "不是必须的，今天先不加"}
  - {text: "不满意能回来调吗？多久之内？", sub: "离店前问，别等回家再后悔"}
