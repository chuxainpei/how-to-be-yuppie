type: steps
title: 一顿 Omakase，从订座到离席
steps:
  - title: 订座时：把话一次说完
    text: "忌口分三种说；问清服务费、定金还是订金、何时取消免费"
    say: "最晚什么时候取消不收费？麻烦发我一条文字确认。"
  - title: 出门前：衣服干净，香水别喷
    tag: 提前十来分钟到
    text: "路上堵了，第一时间打电话"
  - title: 坐上吧台：先问再拍，不懂就问
    tag: 约两小时
    text: "拍自己那一贯，拍完立刻吃"
    say: "这一贯要蘸酱油吗，还是已经调过味了？"
  - title: 结账：问清套餐之外加了什么
    text: "服务费、酒水、席料，各是多少"
  - title: 去不了：越晚取消越贵
    text: "提前几天还能免费改，临近开席扣一半，当天放鸽子基本全价"
