type: steps
title: 第一次洗牙，从打电话到回家
steps:
  - title: 打个电话，或在医院公众号搜“洁治”
    text: 各家叫法不同，问清挂哪个科、要不要先检查
    say: 我想做常规洗牙，挂哪个科？检查完当天能洗吗？
  - title: 进诊室先说身体情况
    text: 心脏起搏器、血液病、抗凝药、怀孕、牙龈正肿着，开始前讲
  - title: 医生检查牙石和牙龈
    text: 听到“刮治”先停下来问，那是另一回事，往往另约另算钱
    say: 要刮治的是哪几颗？和今天分开算钱吗？
  - title: 躺下洗牙
    text: 主要是震动和酸，下门牙内侧最酸；受不了就举手
    say: 我比较怕酸，可以轻一点或者打麻药吗？
  - title: 缴费，拿明细
    text: 看清按牙收还是按全口收、收了哪几项
  - title: 回家后两周
    text: 冷热敏感很常见，两周左右明显好转；一直出血肿痛就复诊
    say: 我下次隔多久来比较合适？
