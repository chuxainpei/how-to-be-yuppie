<style>
/* 配色、字体与虚线分隔沿用 pkusi.com */

.search{position:fixed;z-index:80;left:50%;top:max(8vh,calc(env(safe-area-inset-top) + 10px));width:min(640px,calc(100vw - 24px));transform:translate(-50%,-8px);max-height:min(76vh,680px);display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line-2);background:var(--card);box-shadow:0 30px 80px -24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}

.search .res a.sel,.search .res a:hover{background:var(--hover)}
.search .res b{display:block;font-weight:500;font-size:14.5px}
.search .res b span{font:11px/1 var(--mono);color:var(--soft);margin-right:8px;font-weight:400}
.search .res p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search mark{background:var(--mark);color:var(--fg);border-radius:3px;padding:0 1px}
.search .empty{padding:22px 14px;color:var(--soft);font-size:13.5px}
.lightbox{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--bg) 92%,transparent);opacity:0;pointer-events:none;transition:opacity .25s;cursor:zoom-out}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,10px);padding:9px 14px;border-radius:99px;background:var(--fg);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--ease);z-index:95}

/* 手机底栏 */
.dock{display:none}

/* 中屏：去掉右侧大纲 */

}

  .hero{padding:40px 0 26px}.hero h1{font-size:36px}.hero .lede{font-size:15.5px}
  .cards{grid-template-columns:1fr;gap:8px}

  .ah{padding:30px 0 18px}.ah h1{font-size:27px}.ah .sub{font-size:15.5px}

  .pn{grid-template-columns:1fr;padding-bottom:calc(84px + env(safe-area-inset-bottom))}.pn .nx{grid-column:1}

<script>
(function(){
"use strict";
var REPO="https://github.com/chuxainpei/how-to-be-yuppie";
// 下载走 pkusi.com 镜像：GitHub Release 的文件存在 objects.githubusercontent.com，国内经常打不开
var DL=/(^|\.)pkusi\.com$/.test(location.hostname)?"download/":"https://pkusi.com/yuppie/download/";
var OFFLINE=window.BOOK||null; // 离线单文件版把正文、目录和图片塞进 window.BOOK
var PART_DESC={"把自己收拾体面":"牙齿、眼睛、皮肤、头发、身材。花小钱，先把底子打好。","吃得明白":"西餐、下午茶、高档中餐、Omakase、咖啡茶馆，还有怎么少花冤枉钱。","出门玩":"酒吧、Livehouse、剧院、美术馆、按摩洗浴，第一次去也不露怯。","逛店不怯场":"奢侈品店、奢侈品牌、运动户外品牌，看懂了再决定掏不掏钱。"};
var $=function(s){return document.querySelector(s)};
var view=$("#view"),toc=$("#toc"),side=$("#side"),scrim=$("#scrim"),outline=$("#outline"),pop=$("#pop"),search=$("#search");
var topics=[],byId={},cache={},current=null,store={};
try{store=JSON.parse(localStorage.getItem("yuppie")||"{}")}catch(e){}

store.read=store.read||{};
$("#dl-pdf").href=DL+"how-to-be-yuppie.pdf";$("#dl-html").href=DL+"how-to-be-yuppie.html";
if(OFFLINE){$("#dl-html").style.display="none";}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function get(path){
  if(cache[path])return Promise.resolve(cache[path]);
  if(OFFLINE){var t=OFFLINE.files[path];return t==null?Promise.reject(new Error(path)):Promise.resolve(cache[path]=t);}
  return fetch(encodeURI(path),{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status+" "+path);return r.text()}).then(function(t){return cache[path]=t});
}
function splitTitle(t){var i=t.indexOf("：");return i>0?{name:t.slice(0,i),hook:t.slice(i+1)}:{name:t,hook:""}}

function loadTopics(){
  return get("data/topics.tsv").then(function(t){
    var lines=t.trim().split(/\r?\n/),head=lines.shift().split("\t");
    var ix=function(k){return head.indexOf(k)};
    topics=[{id:"00",part:"",title:"写在前面",path:"book/前言.md",name:"写在前面",hook:""}];
    lines.forEach(function(l){var c=l.split("\t");var o={id:c[ix("topic_id")],part:c[ix("part")],title:c[ix("title")],path:c[ix("path")]};var s=splitTitle(o.title);o.name=s.name;o.hook=s.hook;topics.push(o)});
    topics.forEach(function(o,i){o.i=i;byId[o.id]=o;});
  });
}
function parts(){var g=[];topics.slice(1).forEach(function(o){if(!g.length||g[g.length-1].name!==o.part)g.push({name:o.part,items:[]});g[g.length-1].items.push(o)});return g}

function renderToc(){
  var h='<a href="#/00" data-id="00"><span class="n">00</span><span>写在前面</span></a>';
  parts().forEach(function(p){
    h+='<div class="part"><div class="ph">'+esc(p.name)+'<span>'+p.items[0].id+'–'+p.items[p.items.length-1].id+'</span></div>';
    p.items.forEach(function(o){h+='<a href="#/'+o.id+'" data-id="'+o.id+'"'+(store.read[o.id]?' class="read"':'')+'><span class="n">'+o.id+'</span><span>'+esc(o.title)+'</span></a>'});
    h+='</div>';
  });
  toc.innerHTML=h;
}
function markToc(id){
  toc.querySelectorAll("a").forEach(function(a){var on=a.dataset.id===id;a.classList.toggle("on",on);a.classList.toggle("read",!!store.read[a.dataset.id]);if(on&&matchMedia("(min-width:961px)").matches){var r=a.getBoundingClientRect(),s=side.getBoundingClientRect();if(r.top<s.top+40||r.bottom>s.bottom-40)a.scrollIntoView({block:"center"})}});
}

/* 首页 */
function renderHome(){
  current=null;document.body.classList.remove("reading");outline.innerHTML="";markToc("");
  document.title="精致大学生的第0课";
  var last=store.last&&byId[store.last.id];
  var h='<section class="hero"><div class="k">how to be a yuppie · 25 篇 · dan</div><h1>精致大学生的第0课</h1>'+
    '<p class="lede">给刚来大城市的你：先把自己收拾体面，再大大方方走进那些看起来有点贵的地方。每篇先给我的态度，再告诉你第一次去该怎么开口、钱花在哪、什么别碰。</p>'+
    '<div class="btns"><a class="btn pri" href="#/00">从前言开始读</a><a class="btn" href="'+DL+'how-to-be-yuppie.pdf"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>PDF</a>'+(OFFLINE?'':'<a class="btn" href="'+DL+'how-to-be-yuppie.html">离线单文件</a>')+'<a class="btn" href="'+REPO+'" target="_blank" rel="noopener">GitHub</a></div>';
  if(last&&last.id!=="00"||last&&store.last.p>.05){
    var pct=Math.round((store.last.p||0)*100);
    h+='<a class="resume" href="#/'+last.id+'"><div style="flex:1;min-width:0"><div class="k">继续读 · '+last.id+' · 读到 '+pct+'%</div><b>'+esc(last.title)+'</b><div class="bar"><i style="width:'+pct+'%"></i></div></div><svg class="icon go" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></a>';
  }
  h+='</section>';
  parts().forEach(function(p){
    h+='<div class="band" aria-hidden="true"></div><section class="psec"><h2>'+esc(p.name)+'<span>'+p.items[0].id+'–'+p.items[p.items.length-1].id+'</span></h2><p class="pd">'+esc(PART_DESC[p.name]||"")+'</p><div class="cards">';
    p.items.forEach(function(o){h+='<a class="card'+(store.read[o.id]?' read':'')+'" href="#/'+o.id+'"><span class="n">'+o.id+'</span><b>'+esc(o.name)+'</b>'+(o.hook?'<span class="h">'+esc(o.hook)+'</span>':'')+'</a>'});
    h+='</div></section>';
  });
  h+='<div class="band" aria-hidden="true"></div><div class="home-foot">正文以 <a href="https://creativecommons.org/licenses/by/4.0/deed.zh-hans" target="_blank" rel="noopener">CC BY 4.0</a> 发布，转载改编请署名并附仓库链接；代码 MIT。写错了或者过时了，欢迎去 <a href="'+REPO+'/issues" target="_blank" rel="noopener">GitHub 提 issue</a>。</div>';
  view.innerHTML=h;window.scrollTo(0,0);updateDock();
}

/* 正文渲染 */
function dirname(p){return p.replace(/[^/]*$/,"")}
function resolve(base,rel){var parts=(base+rel).split("/"),out=[];parts.forEach(function(s){if(s===".."){out.pop()}else if(s!=="."&&s!==""){out.push(s)}});return out.join("/")}
function pathToId(p){for(var i=0;i<topics.length;i++)if(topics[i].path===p)return topics[i].id;return null}
function slug(t,used){var s=t.replace(/[\s:：，。、！？“”"'（）()·]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"s";var k=s,n=2;while(used[k])k=s+"-"+n++;used[k]=1;return k}
function render(md,o){
  var base=dirname(o.path);
  md=md.replace(/^#\s+.*\n+/,""); // 标题另行排版
  var html=marked.parse(md,{gfm:true,breaks:false});
  var tmp=document.createElement("div");tmp.innerHTML=html;
  tmp.querySelectorAll("img").forEach(function(img){
    var src=img.getAttribute("src")||"";
    if(!/^(https?:|data:)/.test(src)){var p=resolve(base,decodeURI(src));src=OFFLINE&&OFFLINE.images[p]?OFFLINE.images[p]:encodeURI(p)}
    img.setAttribute("src",src);img.loading="lazy";img.decoding="async";
    var par=img.parentNode,fig=document.createElement("figure"),alt=img.getAttribute("alt")||"";
    if(par.tagName==="P"&&par.childNodes.length===1){par.replaceWith(fig)}else{par.insertBefore(fig,img)}
    fig.appendChild(img);if(alt){var c=document.createElement("figcaption");c.textContent=alt;fig.appendChild(c)}
  });
  tmp.querySelectorAll("a[href]").forEach(function(a){
    var h=a.getAttribute("href");
    if(/^https?:/.test(h)){a.target="_blank";a.rel="noopener"}
    else if(/\.md(#.*)?$/.test(h)){var id=pathToId(resolve(base,decodeURI(h.replace(/#.*$/,""))));if(id)a.setAttribute("href","#/"+id);else a.setAttribute("href",REPO+"/blob/main/"+encodeURI(resolve(base,decodeURI(h))));}
  });
  tmp.querySelectorAll("table").forEach(function(t){var w=document.createElement("div");w.className="tw";t.replaceWith(w);w.appendChild(t)});
  var used={},heads=[];
  tmp.querySelectorAll("h2,h3").forEach(function(h){var id=slug(h.textContent,used);h.id=id;if(h.tagName==="H2")heads.push({id:id,t:h.textContent});var a=document.createElement("a");a.className="hl";a.href="#/"+o.id+"/"+id;a.textContent="#";a.setAttribute("aria-hidden","true");h.prepend(a)});
  // 参考资料收进小字区
  var ref=[].find.call(tmp.querySelectorAll("h2"),function(h){return/参考/.test(h.textContent)});
  if(ref){var box=document.createElement("section");box.className="refs";ref.parentNode.insertBefore(box,ref);var n=ref;while(n){var nx=n.nextSibling;box.appendChild(n);n=nx;if(n&&n.tagName==="H2")break}heads=heads.filter(function(x){return x.id!==ref.id})}
  var text=tmp.textContent.replace(/\s+/g,"");
  return{html:tmp.innerHTML,heads:heads,mins:Math.max(1,Math.round(text.length/420))};
}

function showArticle(id,anchor){
  var o=byId[id];if(!o){location.hash="#/";return}
  var same=current&&current.id===id;
  current=o;document.body.classList.add("reading");markToc(id);closeSide();
  if(same){if(anchor)jump(anchor);return}
  view.innerHTML='<div class="skel"><i></i><i></i><i></i><i style="width:80%"></i><i></i><i style="width:60%"></i></div>';
  outline.innerHTML="";updateDock();
  get(o.path).then(function(md){
    if(current!==o)return;
    var r=render(md,o),prev=topics[o.i-1],next=topics[o.i+1];
    var k=o.id==="00"?"写在前面":'<a href="#/">'+esc(o.part)+'</a> · '+o.id+' / 25';
    var h='<article><header class="ah"><div class="k">'+k+'</div><h1>'+esc(o.hook?o.name:o.title)+'</h1>'+(o.hook?'<p class="sub">'+esc(o.hook)+'</p>':'')+'<div class="meta"><span>约 '+r.mins+' 分钟读完</span></div></header>'+
      '<div class="prose">'+r.html+'</div>'+
      '<div class="afoot"><a href="'+REPO+'/blob/main/'+encodeURI(o.path)+'" target="_blank" rel="noopener">在 GitHub 上看原文</a><a href="'+REPO+'/issues/new?title='+encodeURIComponent("纠错："+o.title)+'" target="_blank" rel="noopener">这篇有错，我来指出</a><a href="#" id="share">复制链接</a></div>'+
      '<nav class="pn">'+(prev?'<a href="#/'+prev.id+'"><span class="k">← 上一篇</span><b>'+esc(prev.title)+'</b></a>':'<a href="#/"><span class="k">← 回到</span><b>首页</b></a>')+
      (next?'<a class="nx" href="#/'+next.id+'"><span class="k">下一篇 →</span><b>'+esc(next.title)+'</b></a>':'<a class="nx" href="#/"><span class="k">读完了 →</span><b>回到首页</b></a>')+'</nav></article>';
    view.innerHTML=h;document.title=o.title+" · 精致大学生的第0课";
    if(r.heads.length>1){outline.innerHTML='<div class="oh">本篇</div>'+r.heads.map(function(x){return'<a href="#/'+o.id+'/'+x.id+'" data-h="'+x.id+'">'+esc(x.t)+'</a>'}).join("")+'<a class="top-link" href="#" data-top="1">↑ 回到顶部</a>'}
    view.querySelectorAll(".prose figure img").forEach(function(img){img.addEventListener("click",function(){openLb(img.src)})});
    $("#share").addEventListener("click",function(e){e.preventDefault();var u=location.href.split("#")[0]+"#/"+o.id;(navigator.share&&matchMedia("(hover:none)").matches?navigator.share({title:o.title,url:u}).catch(function(){}):navigator.clipboard.writeText(u).then(function(){toast("链接已复制")}))});
    if(anchor){jump(anchor)}
    else if(store.pos&&store.pos[o.id]>.03&&store.pos[o.id]<.97&&!navigator.webdriver){var p=store.pos[o.id];requestAnimationFrame(function(){window.scrollTo(0,p*(document.documentElement.scrollHeight-innerHeight));toast("已回到上次读到的位置")})}
    else window.scrollTo(0,0);
    updateDock();onScroll();
  }).catch(function(e){view.innerHTML='<div class="err">这篇没加载出来（'+esc(e.message)+'）。<br>如果是直接双击打开的本地文件，请改用离线单文件版，或在目录里运行 <code>python3 -m http.server</code>。</div>'});
}
function jump(a){var el=document.getElementById(a);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}

/* 路由 */
function route(){
  var m=location.hash.match(/^#\/(\d{2})?(?:\/(.+))?/);
  if(!m||!m[1]){renderHome();return}
  showArticle(m[1],m[2]?decodeURIComponent(m[2]):null);
}

/* 滚动：进度、大纲高亮、记住位置、底栏收起 */
var lastY=0,ticking=false,saveT;
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(function(){
    ticking=false;var y=scrollY,max=document.documentElement.scrollHeight-innerHeight,p=max>0?Math.min(1,y/max):0;
    $("#progress").style.transform="scaleX("+(current?p:0)+")";
    if(current){
      var dock=$("#dock");if(y>lastY+8&&y>200)dock.classList.add("hide");else if(y<lastY-8||p>.98)dock.classList.remove("hide");
      var on=null;outline.querySelectorAll("a[data-h]").forEach(function(a){var el=document.getElementById(a.dataset.h);if(el&&el.getBoundingClientRect().top<innerHeight*.3)on=a});
      outline.querySelectorAll("a[data-h]").forEach(function(a){a.classList.toggle("on",a===on)});
      clearTimeout(saveT);var id=current.id;saveT=setTimeout(function(){store.pos=store.pos||{};store.pos[id]=p;store.last={id:id,p:p};if(p>.85&&!store.read[id]){store.read[id]=1;markToc(id)}save()},250);
    }
    lastY=y;
  });
}
addEventListener("scroll",onScroll,{passive:true});

/* 手机底栏 */
function updateDock(){
  if(!current)return;var prev=topics[current.i-1],next=topics[current.i+1];
  var p=$("#dk-prev"),n=$("#dk-next");
  p.href=prev?"#/"+prev.id:"#/";p.setAttribute("aria-disabled",prev?"false":"true");
  n.href=next?"#/"+next.id:"#/";n.setAttribute("aria-disabled",next?"false":"true");
  $("#dk-pg").textContent=current.id==="00"?"前言":current.id+"/25";$("#dock").classList.remove("hide");
}
$("#dk-pg").addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})});
$("#dk-toc").addEventListener("click",openSide);
$("#dk-aa").addEventListener("click",function(e){e.stopPropagation();togglePop()});

/* 目录抽屉 */
function openSide(){side.classList.add("on");scrim.classList.add("on");$("#btn-menu").setAttribute("aria-expanded","true");var a=toc.querySelector("a.on");if(a)a.scrollIntoView({block:"center"})}
function closeSide(){side.classList.remove("on");if(!search.classList.contains("on"))scrim.classList.remove("on");$("#btn-menu").setAttribute("aria-expanded","false")}
$("#btn-menu").addEventListener("click",openSide);$("#btn-close").addEventListener("click",closeSide);
scrim.addEventListener("click",function(){closeSide();closeSearch();closePop()});
toc.addEventListener("click",function(e){if(e.target.closest("a"))closeSide()});
outline.addEventListener("click",function(e){var a=e.target.closest("a");if(!a)return;e.preventDefault();if(a.dataset.top)window.scrollTo({top:0,behavior:"smooth"});else{jump(a.dataset.h);history.replaceState(null,"",a.getAttribute("href"))}});
view.addEventListener("click",function(e){var a=e.target.closest("a.hl");if(a){e.preventDefault();var id=a.getAttribute("href").split("/").pop();jump(id);history.replaceState(null,"",a.getAttribute("href"))}});

/* 阅读设置 */
function togglePop(){pop.classList.contains("on")?closePop():(pop.classList.add("on"),$("#btn-aa").setAttribute("aria-expanded","true"),syncSeg())}
function closePop(){pop.classList.remove("on");$("#btn-aa").setAttribute("aria-expanded","false")}
function syncSeg(){var fs=document.documentElement.dataset.fs||"";$("#seg-fs").querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.v===fs)});var dk=document.documentElement.classList.contains("dark");$("#seg-th").querySelectorAll("button").forEach(function(b){b.classList.toggle("on",(b.dataset.v==="dark")===dk)})}
$("#btn-aa").addEventListener("click",function(e){e.stopPropagation();togglePop()});
pop.addEventListener("click",function(e){e.stopPropagation()});
document.addEventListener("click",function(){closePop()});
$("#seg-fs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var v=b.dataset.v,r=document.documentElement;var keep=current?scrollY/(document.documentElement.scrollHeight-innerHeight||1):0;if(v)r.dataset.fs=v;else delete r.dataset.fs;try{localStorage.setItem("yuppie-fs",v)}catch(e){}if(current)window.scrollTo(0,keep*(document.documentElement.scrollHeight-innerHeight));syncSeg()});
$("#seg-th").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var dk=b.dataset.v==="dark";document.documentElement.classList.toggle("dark",dk);try{localStorage.setItem("theme",dk?"dark":"light")}catch(e){}syncSeg()});

/* 搜索 */
var allLoaded=null,sel=-1;
function loadAll(){return allLoaded||(allLoaded=Promise.all(topics.map(function(o){return get(o.path).catch(function(){return""})})))}
function openSearch(){search.classList.add("on");scrim.classList.add("on");closeSide();var q=$("#q");setTimeout(function(){q.focus();q.select()},30);loadAll().then(doSearch);doSearch()}
function closeSearch(){search.classList.remove("on");if(!side.classList.contains("on"))scrim.classList.remove("on");$("#q").blur()}
$("#btn-search").addEventListener("click",openSearch);$("#q-close").addEventListener("click",closeSearch);
function plain(md){return md.replace(/^#.*$/gm,"").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[*_>`|#-]/g,"").replace(/\s+/g," ")}
function doSearch(){
  var q=$("#q").value.trim(),res=$("#res");sel=-1;
  if(!q){res.innerHTML='<div class="empty">'+topics.slice(1).filter(function(o,i){return i%5===0}).map(function(o){return'<a href="#/'+o.id+'"><b><span>'+o.id+'</span>'+esc(o.title)+'</b></a>'}).join("")+'</div>';return}
  var terms=q.toLowerCase().split(/\s+/).filter(Boolean),out=[];
  topics.forEach(function(o){
    var body=cache[o.path]?plain(cache[o.path]):"",tl=o.title.toLowerCase(),bl=body.toLowerCase(),score=0,pos=-1;
    for(var i=0;i<terms.length;i++){var t=terms[i],inT=tl.indexOf(t)>=0,bi=bl.indexOf(t);if(!inT&&bi<0)return;score+=(inT?10:0)+(bi>=0?1+Math.min(5,bl.split(t).length-1):0);if(pos<0&&bi>=0)pos=bi}
    var snip=pos>=0?body.slice(Math.max(0,pos-24),pos+90):"";out.push({o:o,s:score,snip:(pos>24?"…":"")+snip});
  });
  out.sort(function(a,b){return b.s-a.s});
  var re=new RegExp("("+terms.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|")+")","gi");
  var hl=function(s){return esc(s).replace(re,"<mark>$1</mark>")};
  res.innerHTML=out.length?out.slice(0,30).map(function(r){return'<a href="#/'+r.o.id+'"><b><span>'+r.o.id+'</span>'+hl(r.o.title)+'</b>'+(r.snip?'<p>'+hl(r.snip)+'</p>':'')+'</a>'}).join(""):'<div class="empty">'+(allLoaded?"没找到。换个说法试试，比如“预约”“多少钱”。":"正在载入正文…")+'</div>';
}
$("#q").addEventListener("input",doSearch);
$("#q").addEventListener("keydown",function(e){var items=$("#res").querySelectorAll("a");if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,Math.min(items.length-1,sel+(e.key==="ArrowDown"?1:-1)));items.forEach(function(a,i){a.classList.toggle("sel",i===sel)});if(items[sel])items[sel].scrollIntoView({block:"nearest"})}else if(e.key==="Enter"){var a=items[Math.max(0,sel)];if(a){location.hash=a.getAttribute("href");closeSearch()}}});
$("#res").addEventListener("click",function(e){if(e.target.closest("a"))closeSearch()});

/* 看大图 */
var lb=$("#lightbox");function openLb(src){lb.querySelector("img").src=src;lb.classList.add("on")}lb.addEventListener("click",function(){lb.classList.remove("on")});
var tt;function toast(s){var t=$("#toast");t.textContent=s;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},1800)}

/* 键盘 */
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeSearch();closeSide();closePop();lb.classList.remove("on");return}
  var typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="/"||e.key==="k"){e.preventDefault();openSearch()}
  else if(current&&e.key==="ArrowLeft"){var p=topics[current.i-1];location.hash=p?"#/"+p.id:"#/"}
  else if(current&&e.key==="ArrowRight"){var n=topics[current.i+1];if(n)location.hash="#/"+n.id}
});
/* 手机左缘右滑打开目录 */
var sx=null;addEventListener("touchstart",function(e){var t=e.touches[0];sx=t.clientX<24?{x:t.clientX,y:t.clientY}:null},{passive:true});
addEventListener("touchend",function(e){if(!sx)return;var t=e.changedTouches[0];if(t.clientX-sx.x>60&&Math.abs(t.clientY-sx.y)<50)openSide();sx=null},{passive:true});

addEventListener("hashchange",route);
loadTopics().then(function(){renderToc();route()}).catch(function(e){view.innerHTML='<div class="err">目录没加载出来（'+esc(e.message)+'）。<br>这个页面要通过网址打开：在仓库目录运行 <code>python3 -m http.server</code> 再访问 http://localhost:8000/ ，或者下载离线单文件版。</div>'});
})();
</script>
